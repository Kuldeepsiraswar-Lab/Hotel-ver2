<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Amber Glow Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Restaurant Cloche & POS Symbol -->
  <g filter="url(#subtleShadow)">
    <!-- Cloche Top Knob -->
    <circle cx="256" cy="144" r="18" fill="url(#goldGrad)" />
    <path d="M256 160 L256 172" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Cloche Dome -->
    <path d="M128 290 C128 200, 384 200, 384 290 Z" fill="url(#goldGrad)" />

    <!-- Cloche Steam / Aroma Curves -->
    <path d="M220 120 C210 100, 230 80, 220 60" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M256 115 C246 95, 266 75, 256 55" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <path d="M292 120 C282 100, 302 80, 292 60" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Cloche Base Platter / Tray -->
    <rect x="104" y="296" width="304" height="20" rx="10" fill="#ffffff" />
    
    <!-- POS Terminal / Receipt Card Foundation -->
    <rect x="156" y="328" width="200" height="88" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="4" />

    <!-- Terminal Screen / Bill Lines -->
    <rect x="176" y="348" width="80" height="8" rx="4" fill="#fbbf24" />
    <rect x="176" y="366" width="120" height="6" rx="3" fill="#94a3b8" />
    <rect x="176" y="380" width="60" height="6" rx="3" fill="#94a3b8" />
    
    <!-- Checkmark Badge on Terminal -->
    <circle cx="324" cy="372" r="16" fill="#10b981" />
    <path d="M317 372 L322 377 L331 367" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
